<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>資源枯渇計算（動画版）</title>
<meta name="description" content="画面録画の動画から残存資源の減り方を読み取り、枯渇までの時間を計算します。">
<style>
  :root {
    --bg: #12150e;
    --panel: #1c2115;
    --panel-2: #242b1b;
    --line: #333c27;
    --text: #e9eddc;
    --muted: #a3ad8f;
    --accent: #b9dc4a;
    --accent-ink: #172008;
    --warn: #ffb454;
    --bad: #ff7a6b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: .02em; }
  h1 small { font-size: .8rem; color: var(--accent); font-weight: 600; margin-left: 6px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .lead { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 52px; width: 100%;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 12px;
    font: inherit; font-weight: 700; font-size: 1.05rem;
    cursor: pointer;
  }
  .btn:active { filter: brightness(.92); }
  .btn.ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--line); font-weight: 600; font-size: .95rem;
    min-height: 44px;
  }
  .hint { color: var(--muted); font-size: .85rem; margin: 12px 0 0; }
  .bar { height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 10px 0 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .status { font-size: .9rem; color: var(--muted); margin: 0 0 10px; min-height: 1.4em; }
  .hero { text-align: center; padding: 6px 0 14px; }
  .hero .label { color: var(--muted); font-size: .85rem; }
  .hero .msg { font-size: 1.05rem; margin: 10px 0; }
  .hero .msg b { color: var(--accent); font-size: 1.25rem; }
  .hero .big { font-size: 2.3rem; font-weight: 800; color: var(--accent); line-height: 1.3; }
  .hero .sub { color: var(--muted); font-size: .95rem; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; }
  dt { color: var(--muted); font-size: .9rem; }
  dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .notice { border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin: 0 0 12px; background: var(--panel-2); }
  .notice.warn { border-left: 4px solid var(--warn); }
  .notice.bad { border-left: 4px solid var(--bad); }
  .row {
    display: grid; grid-template-columns: auto 52px 1fr; gap: 10px; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .row .t { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .row input[type=text] {
    width: 100%; min-height: 40px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font: inherit; font-variant-numeric: tabular-nums;
  }
  .row.off { opacity: .45; }
  .row img { grid-column: 1 / -1; width: 100%; border-radius: 6px; display: none; }
  details[open] .row img { display: block; }
  summary { cursor: pointer; color: var(--muted); font-size: .85rem; padding: 6px 0; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions .btn { flex: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .offscreen { position: fixed; left: -9999px; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  footer { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>資源枯渇計算<small>動画版</small></h1>
    <p class="lead">画面録画の動画を選ぶと、残存資源の減り方から枯渇までの時間を計算します。動画は端末の中だけで処理され、どこにも送信されません。</p>
  </header>

  <section class="card" id="pickCard">
    <label class="btn" for="file">動画を選ぶ</label>
    <input class="sr" id="file" type="file" accept="video/*">
    <p class="hint">録画のコツ：ギルド農場の「詳細情報」画面（残存資源が出る画面）を映したまま、20秒以上録画してください。録画の最初や最後にコントロールセンターなど他の画面が映っていても大丈夫です。</p>
  </section>

  <section class="card" id="progressCard" hidden>
    <h2 id="fileName">読み取り中</h2>
    <div class="bar"><i id="barFill"></i></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="btn ghost" id="cancelBtn" type="button">中止</button>
  </section>

  <section class="card" id="resultCard" hidden>
    <div id="notices"></div>
    <div id="resultBody"></div>
  </section>

  <section class="card" id="readingsCard" hidden>
    <h2>読み取った数字</h2>
    <p class="hint" style="margin-top:0">読み違いがあれば数字を直すか、チェックを外すと計算し直します。</p>
    <details open id="rowsWrap">
      <summary>画像も見る / 閉じる</summary>
      <div id="rows"></div>
    </details>
  </section>

  <footer>数字の読み取りには Tesseract.js（ブラウザ内OCR）を使っています。</footer>
</main>

<video id="v" class="offscreen" muted playsinline preload="auto"></video>
<canvas id="c" class="offscreen"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const video = $('#v');
  const canvas = $('#c');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // 画面の上のほうにある「残存資源」の数字を探す範囲（動画の高さに対する割合）。
  // まず狭い範囲で探し、見つからなければ広い範囲で探す。
  const BANDS = [[0.08, 0.32], [0.0, 0.5]];
  const MAX_FRAMES = 40;       // 読み取るフレーム数の上限
  const MAX_WIDTH = 1100;      // OCRに渡す画像の最大幅(px)
  const MIN_SPAN_SEC = 8;      // これ未満だと精度が落ちる

  let worker = null;
  let cancelled = false;
  let busy = false;
  let rows = [];               // {t, v, use, thumb}
  let lastSummary = '';

  // ---------- 表示用 ----------
  const fmtInt = (n) => Math.round(n).toLocaleString('ja-JP');
  function fmtDuration(sec) {
    sec = Math.max(0, Math.round(sec));
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const parts = [];
    if (d) parts.push(d + '日');
    if (d || h) parts.push(h + '時間');
    parts.push(m + '分');
    return parts.join('');
  }
  // 「42時間29分」のように、日を使わず時間と分で表す
  function fmtHM(sec) {
    const total = Math.max(0, Math.round(sec / 60));
    return `${Math.floor(total / 60)}時間${total % 60}分`;
  }
  // 日本時間の「10月11日(日) 08:55」
  function fmtJst(date) {
    const p = {};
    new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', weekday: 'short',
      hour: '2-digit', minute: '2-digit', hour12: false,
    }).formatToParts(date).forEach((x) => { p[x.type] = x.value; });
    const hh = p.hour === '24' ? '00' : p.hour;
    return `${p.month}月${p.day}日(${p.weekday}) ${hh}:${p.minute}`;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- 計算 ----------
  // 時間順に並べたとき、値が減り続ける（増えない）最長の並びを残す。
  // 読み違いの数字は、この並びから外れやすい。
  function longestNonIncreasing(list) {
    const n = list.length;
    if (!n) return [];
    const len = new Array(n).fill(1);
    const prev = new Array(n).fill(-1);
    let best = 0;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < i; j++) {
        if (list[j].v >= list[i].v && len[j] + 1 > len[i]) {
          len[i] = len[j] + 1;
          prev[i] = j;
        }
      }
      if (len[i] > len[best]) best = i;
    }
    const keep = new Set();
    for (let k = best; k !== -1; k = prev[k]) keep.add(list[k]);
    return list.filter((r) => keep.has(r));
  }

  function median(arr) {
    const a = arr.slice().sort((x, y) => x - y);
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // 読み取り結果から、明らかにおかしい行の use を false にする
  function autoReject(list) {
    list.forEach((r) => { r.use = true; });
    if (list.length < 3) return;
    const med = median(list.map((r) => r.v));
    list.forEach((r) => { if (r.v < med * 0.5 || r.v > med * 2) r.use = false; });
    const sorted = list.filter((r) => r.use).sort((a, b) => a.t - b.t);
    const keep = new Set(longestNonIncreasing(sorted));
    sorted.forEach((r) => { if (!keep.has(r)) r.use = false; });
  }

  function analyze(list) {
    const pts = list
      .filter((r) => r.use && Number.isFinite(r.v))
      .sort((a, b) => a.t - b.t);
    if (pts.length < 2) return { error: '数字が読めたフレームが2つ未満です。残存資源が映っている動画か確認してください。' };
    const first = pts[0], last = pts[pts.length - 1];
    const span = last.t - first.t;
    if (span <= 0) return { error: '読み取れたフレームの時間差がありません。' };

    // 最小二乗法で「1秒あたりの減少量」を求める
    const n = pts.length;
    const mt = pts.reduce((s, p) => s + p.t, 0) / n;
    const mv = pts.reduce((s, p) => s + p.v, 0) / n;
    let num = 0, den = 0;
    for (const p of pts) { num += (p.t - mt) * (p.v - mv); den += (p.t - mt) ** 2; }
    const slope = den ? num / den : 0;
    const rate = -slope;
    if (!(rate > 0)) return { error: '残存資源が減っていません（増減なし）。採集中の画面で、もう少し長く録画してみてください。' };

    return {
      n, first, last, span, rate,
      per30: rate * 30,
      perMin: rate * 60,
      remainSec: last.v / rate,
      lowSpan: span < MIN_SPAN_SEC,
    };
  }
  window.__analyze = analyze;           // 動作確認用
  window.__autoReject = autoReject;     // 動作確認用

  // ---------- 動画の扱い ----------
  function waitEvent(el, name, ms) {
    return new Promise((resolve, reject) => {
      let timer = null;
      const done = (ok) => {
        el.removeEventListener(name, onEv);
        el.removeEventListener('error', onErr);
        if (timer) clearTimeout(timer);
        ok ? resolve() : reject(new Error('video error'));
      };
      const onEv = () => done(true);
      const onErr = () => done(false);
      el.addEventListener(name, onEv);
      el.addEventListener('error', onErr);
      if (ms) timer = setTimeout(() => done(true), ms);
    });
  }

  async function seek(t) {
    if (Math.abs(video.currentTime - t) < 0.001) return;
    const p = waitEvent(video, 'seeked', 4000);
    video.currentTime = t;
    await p;
  }

  async function loadVideo(file) {
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
    await waitEvent(video, 'loadedmetadata', 10000);
    if (video.readyState < 2) await waitEvent(video, 'loadeddata', 10000);
    return url;
  }

  // ---------- OCR ----------
  function setStatus(text) { $('#status').textContent = text; }
  function setBar(p) { $('#barFill').style.width = Math.round(p * 100) + '%'; }

  async function getWorker() {
    if (worker) return worker;
    if (typeof Tesseract === 'undefined') {
      throw new Error('OCRエンジンを読み込めませんでした。ネット接続を確認してください。');
    }
    const extra = window.TESS_OPTS || {};
    worker = await Tesseract.createWorker('eng', 1, {
      logger: (m) => {
        if (m.status && /loading|initializ/i.test(m.status)) setStatus('OCRエンジンを準備中…');
      },
      ...extra,
    });
    await worker.setParameters({
      tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
      tessedit_char_whitelist: '0123456789,:',
    });
    return worker;
  }

  function drawBand(y0, y1) {
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.min(1, MAX_WIDTH / vw);
    const sy = Math.floor(vh * y0);
    const sh = Math.max(1, Math.floor(vh * (y1 - y0)));
    canvas.width = Math.round(vw * scale);
    canvas.height = Math.round(sh * scale);
    ctx.drawImage(video, 0, sy, vw, sh, 0, 0, canvas.width, canvas.height);
  }

  // OCRの文字列から、いちばん大きい数字を取り出す
  function pickNumber(text) {
    const tokens = text.match(/\d{1,3}(?:,\d{3})+|\d{7,}/g) || [];
    let best = null;
    for (const tk of tokens) {
      const v = Number(tk.replace(/,/g, ''));
      if (Number.isFinite(v) && (best === null || v > best)) best = v;
    }
    return best;
  }

  function makeThumb() {
    const w = 420;
    const h = Math.max(1, Math.round(canvas.height * (w / canvas.width)));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(canvas, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.55);
  }

  async function readFrame(w) {
    for (const [y0, y1] of BANDS) {
      drawBand(y0, y1);
      const { data } = await w.recognize(canvas);
      const v = pickNumber(data.text || '');
      if (v !== null) return { v, thumb: makeThumb() };
    }
    return null;
  }

  // ---------- 画面更新 ----------
  function renderRows() {
    const box = $('#rows');
    box.innerHTML = '';
    rows.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'row' + (r.use ? '' : ' off');
      el.innerHTML =
        `<input type="checkbox" aria-label="${r.t.toFixed(0)}秒の読み取りを使う" ${r.use ? 'checked' : ''}>` +
        `<span class="t">${r.t.toFixed(1)}秒</span>` +
        `<input type="text" inputmode="numeric" aria-label="${r.t.toFixed(0)}秒の残存資源" value="${esc(fmtInt(r.v))}">` +
        `<img alt="" src="${r.thumb}">`;
      const [cb, tx] = el.querySelectorAll('input');
      cb.addEventListener('change', () => { r.use = cb.checked; el.classList.toggle('off', !r.use); showResult(); });
      tx.addEventListener('change', () => {
        const v = Number(String(tx.value).replace(/[^\d]/g, ''));
        if (Number.isFinite(v) && v > 0) r.v = v;
        tx.value = fmtInt(r.v);
        showResult();
      });
      box.appendChild(el);
    });
    $('#readingsCard').hidden = rows.length === 0;
  }

  function showResult(extraNotices) {
    const a = analyze(rows);
    const notices = $('#notices');
    const body = $('#resultBody');
    notices.innerHTML = '';
    body.innerHTML = '';
    lastSummary = '';
    $('#resultCard').hidden = false;

    (extraNotices || []).forEach((n) => {
      notices.insertAdjacentHTML('beforeend', `<p class="notice ${n.kind}">${esc(n.text)}</p>`);
    });

    if (a.error) {
      notices.insertAdjacentHTML('beforeend', `<p class="notice bad">${esc(a.error)}</p>`);
      return;
    }
    if (a.lowSpan) {
      notices.insertAdjacentHTML('beforeend',
        `<p class="notice warn">使えた範囲が${a.span.toFixed(0)}秒しかありません。20秒以上映っている動画のほうが正確です。</p>`);
    }

    const done = new Date(Date.now() + a.remainSec * 1000);
    const hm = fmtHM(a.remainSec);
    const perMin = fmtInt(a.perMin);
    const when = fmtJst(done);
    lastSummary =
      `ギルド資源、今の人数で…\n` +
      `資源が尽きるまで、あと ${hm}です。\n` +
      `（1分あたり ${perMin} 減少）\n` +
      `日本時間 ${when}頃に尽きる見込みです。`;

    body.innerHTML =
      `<div class="hero">` +
        `<div class="label">ギルド資源、今の人数で…</div>` +
        `<div class="msg">資源が尽きるまで、あと<br><span class="big">${esc(hm)}</span>です。</div>` +
        `<div class="sub">（1分あたり ${perMin} 減少）</div>` +
        `<div class="msg">日本時間 <b>${esc(when)}</b> 頃に<br>尽きる見込みです。</div>` +
      `</div>` +
      `<dl>` +
        `<dt>30秒あたりの減少</dt><dd>-${fmtInt(a.per30)}</dd>` +
        `<dt>最後に読めた残存資源</dt><dd>${fmtInt(a.last.v)}</dd>` +
        `<dt>計算に使った範囲</dt><dd>${a.span.toFixed(1)}秒（${a.n}か所）</dd>` +
      `</dl>` +
      `<div class="actions">` +
        `<button class="btn ghost" id="copyBtn" type="button">結果をコピー</button>` +
        `<label class="btn ghost" for="file" style="margin:0">別の動画</label>` +
      `</div>`;
    $('#copyBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      try { await navigator.clipboard.writeText(lastSummary); btn.textContent = 'コピーしました'; }
      catch (_) { btn.textContent = 'コピーできませんでした'; }
      setTimeout(() => { btn.textContent = '結果をコピー'; }, 1800);
    });
  }

  // ---------- メイン処理 ----------
  async function run(file) {
    if (busy) return;
    busy = true; cancelled = false; rows = [];
    $('#resultCard').hidden = true;
    $('#readingsCard').hidden = true;
    $('#progressCard').hidden = false;
    $('#fileName').textContent = '読み取り中';
    setBar(0);
    setStatus('動画を開いています…');
    let url = null;
    try {
      url = await loadVideo(file);
      const dur = video.duration;
      if (!isFinite(dur) || dur < 3 || !video.videoWidth) {
        throw new Error('この動画は読み込めませんでした（長さが取得できません）。');
      }
      const step = Math.max(1, Math.ceil(dur / MAX_FRAMES));
      const times = [];
      for (let t = 0; t < dur - 0.05; t += step) times.push(Math.max(t, 0.05));

      setStatus('OCRエンジンを準備中…');
      const w = await getWorker();

      let unreadable = 0;
      for (let i = 0; i < times.length; i++) {
        if (cancelled) break;
        setStatus(`${i + 1} / ${times.length} フレーム目を読み取り中…`);
        setBar(i / times.length);
        await seek(times[i]);
        const got = await readFrame(w);
        if (got) rows.push({ t: video.currentTime, v: got.v, use: true, thumb: got.thumb });
        else unreadable++;
      }
      setBar(1);

      if (cancelled) { setStatus('中止しました。'); $('#progressCard').hidden = true; return; }

      autoReject(rows);
      $('#progressCard').hidden = true;
      renderRows();
      const notes = [];
      if (rows.length === 0) {
        notes.push({ kind: 'bad', text: '残存資源の数字が1つも読めませんでした。「詳細情報」画面が映っているか、録画で画面が真っ黒になっていないか確認してください。' });
      } else if (unreadable > 0) {
        notes.push({ kind: 'warn', text: `${unreadable}フレームは数字が読めなかったため、計算から除いています（他の画面が映っていた部分など）。` });
      }
      const rejected = rows.filter((r) => !r.use).length;
      if (rejected > 0) {
        notes.push({ kind: 'warn', text: `${rejected}か所は読み違いの可能性が高いため自動で外しました。下の一覧で戻せます。` });
      }
      showResult(notes);
    } catch (err) {
      $('#progressCard').hidden = true;
      $('#resultCard').hidden = false;
      $('#notices').innerHTML = `<p class="notice bad">${esc(err.message || err)}</p>`;
      $('#resultBody').innerHTML = '';
    } finally {
      if (url) URL.revokeObjectURL(url);
      busy = false;
    }
  }

  $('#file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) run(f);
    e.target.value = '';   // 同じ動画をもう一度選べるようにする
  });
  $('#cancelBtn').addEventListener('click', () => { cancelled = true; });
})();
</script>
</body>
</html>
